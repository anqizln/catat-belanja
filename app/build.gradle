plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anqi.catatbelanja'
    compileSdk 35

    defaultConfig {
        applicationId "com.anqi.catatbelanja"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.2"
    }

    // Kunci tanda tangan tetap (dari GitHub secret) supaya update tidak perlu uninstall
    def ks = file("release.keystore")
    signingConfigs {
        stable {
            if (ks.exists()) {
                storeFile ks
                storePassword "catatbelanja"
                keyAlias "catatbelanja"
                keyPassword "catatbelanja"
            }
        }
    }

    buildTypes {
        debug {
            if (ks.exists()) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
