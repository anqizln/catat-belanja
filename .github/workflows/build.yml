name: Build APK & Web

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.keystore; echo "pakai kunci tetap"; else echo "secret KEYSTORE_B64 belum ada, pakai kunci debug"; fi
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CatatBelanja.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CatatBelanja-apk
          path: CatatBelanja.apk
      - name: Rilis (link download tetap)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Catat Belanja build ${{ github.run_number }}
          files: CatatBelanja.apk
          make_latest: true

  web:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets
      - id: deploy
        uses: actions/deploy-pages@v4
